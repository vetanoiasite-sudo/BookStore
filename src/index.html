<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title> Vetanoia Store </title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="منصة لبيع وشراء الكتب المستعملة، تدير عملية البيع بالكامل بين البائع والمشتري."
    />
    <meta name="theme-color" content="#743014" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <script>
      // Apply the saved colour scheme before first paint, so the page never flashes
      // the other one. ThemeService takes over once the app boots.
      try {
        if (localStorage.getItem('bookstore.theme') === 'purple') {
          document.documentElement.dataset.theme = 'purple';
          document.querySelector('link[rel="icon"]').href = 'logo-purple.svg';
        }
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Oswald:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Holds the brand purple while the app boots; Angular replaces it with the preloader. -->
    <app-root
      ><div style="position: fixed; inset: 0; background: linear-gradient(var(--bs-scrim) 0 0), var(--bs-primary-light)"></div
    ></app-root>
  </body>
</html>
