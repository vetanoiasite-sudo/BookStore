<section class="not-found">
  <div class="bs-container not-found__inner">
    <p class="not-found__code">{{ 'notFound.code' | t }}</p>
    <h1 class="not-found__title">{{ 'notFound.title' | t }}</h1>
    <p class="not-found__text">{{ 'notFound.text' | t }}</p>
    <a routerLink="/" class="not-found__link">{{ 'notFound.action' | t }}</a>
  </div>
</section>
